name: CPU contract checks

on:
  pull_request:
  push:
    branches: [main, "ateam/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4e5daca2fe1f29719
        with:
          python-version: "3.10"
      - name: Install project and test dependencies
        run: >-
          python -m pip install --upgrade pip &&
          python -m pip install numpy==2.2.6 pytest==9.1.1 &&
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.12.1 &&
          python -m pip install -e . --no-deps
      - name: Test
        run: python -m pytest -q
      - name: Validate phase-gate catalog and runner contracts
        run: |
          python scripts/check_phase.py --list
          python -m pytest -q tests/quality --tb=short
      - name: Run active automated phase evidence
        run: |
          python scripts/check_phase.py T1C --run --report-dir /tmp/smagm-quality-reports
          python scripts/check_phase.py T2 --run --report-dir /tmp/smagm-quality-reports
          python scripts/check_phase.py T3 --run --report-dir /tmp/smagm-quality-reports
          python scripts/check_phase.py T5 --run --report-dir /tmp/smagm-quality-reports
      - name: Validate public CLI contracts
        run: |
          python scripts/train.py --help
          python scripts/reconstruct.py --help
          python scripts/evaluate.py --help
          python scripts/audit.py --help
      - name: Run full static synthetic chain
        run: |
          python scripts/train.py \
            --config configs/experiments/full_static_pipeline.json \
            --variant full \
            --steps 2 \
            --output-dir /tmp/smagm-full-static-train
          python scripts/reconstruct.py \
            --config configs/experiments/full_static_pipeline.json \
            --checkpoint /tmp/smagm-full-static-train/checkpoint.pt \
            --manifest /tmp/smagm-full-static-train/eval_manifest.json \
            --output-dir /tmp/smagm-full-static-reconstruction
          python scripts/evaluate.py \
            --plan configs/evaluation/full_static_eval.json \
            --predictions /tmp/smagm-full-static-reconstruction \
            --output-dir /tmp/smagm-full-static-report
          python scripts/audit.py \
            --package /tmp/smagm-full-static-reconstruction
      - name: Compile sources, tests, and scripts
        run: python -m compileall -q src tests scripts
      - name: Require a clean checkout after validation
        run: git diff --check && test -z "$(git status --porcelain)"
