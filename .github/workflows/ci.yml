name: CPU contract checks

on:
  pull_request:
  push:
    branches: [main, "ateam/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Test
        run: python -m pytest -q
      - name: Compile sources and tests
        run: python -m compileall -q src tests
      - name: Require a clean checkout after validation
        run: git diff --check && test -z "$(git status --porcelain)"
