name: CPU contract checks

on:
  pull_request:
  push:
    branches: [main, "ateam/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
      - name: Install project and test dependencies
        run: >-
          python -m pip install --upgrade pip &&
          python -m pip install numpy==2.2.6 pytest==9.1.1 &&
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.12.1 &&
          python -m pip install -e . --no-deps
      - name: Test
        run: python -m pytest -q
      - name: Validate phase-gate catalog and runner contracts
        run: |
          python scripts/check_phase.py --list
          python -m pytest -q tests/quality --tb=short
      - name: Run active automated phase evidence
        run: |
          python scripts/check_phase.py POINT_GUIDED_FRONTEND --run --report-dir /tmp/smagm-quality-reports
      - name: Validate public CLI contracts
        run: |
          python scripts/train.py --help
          python scripts/reconstruct.py --help
          python scripts/evaluate.py --help
          python scripts/audit.py --help
      - name: Run full static synthetic chain
        run: |
          python scripts/train.py \
            --config configs/experiments/full_static_pipeline.json \
            --variant full \
            --steps 2 \
            --output-dir /tmp/smagm-full-static-train
          python scripts/reconstruct.py \
            --config configs/experiments/full_static_pipeline.json \
            --checkpoint /tmp/smagm-full-static-train/checkpoint.pt \
            --manifest /tmp/smagm-full-static-train/eval_manifest.json \
            --output-dir /tmp/smagm-full-static-reconstruction
          python scripts/evaluate.py \
            --plan configs/evaluation/full_static_eval.json \
            --predictions /tmp/smagm-full-static-reconstruction \
            --output-dir /tmp/smagm-full-static-report
          python scripts/audit.py \
            --package /tmp/smagm-full-static-reconstruction
      - name: Run bounded PFGR synthetic diagnostics
        run: |
          set -euo pipefail
          PFGR_OUTPUT=/tmp/smagm-pfgr-synthetic
          python -m smagm.cli.pfgr_lite smoke \
            --synthetic --config configs/pfgr_lite/synthetic.json \
            --output-root "$PFGR_OUTPUT" --run-name smoke \
            --device cpu --no-amp --max-subjects 1 --max-steps 1
          test -f "$PFGR_OUTPUT/smoke/inference.pt"
          python -m smagm.cli.pfgr_lite updater-train \
            --synthetic --config configs/pfgr_lite/synthetic.json \
            --output-root "$PFGR_OUTPUT" --run-name updater \
            --device cpu --no-amp --max-subjects 1 --max-steps 1 \
            --checkpoint "$PFGR_OUTPUT/smoke/inference.pt" \
            --spectral-arm u_plus_spectral
          test -f "$PFGR_OUTPUT/updater/inference.pt"
          python -m smagm.cli.pfgr_lite bank-build \
            --synthetic --config configs/pfgr_lite/synthetic.json \
            --output-root "$PFGR_OUTPUT" --run-name bank \
            --device cpu --no-amp --max-subjects 1 --max-states 1 \
            --checkpoint "$PFGR_OUTPUT/updater/inference.pt" \
            --candidate-count 2 --query-count 8 --teacher-mode iid_fixed_q
          PFGR_BANK="$PFGR_OUTPUT/bank/s2/bank/index.json"
          test -f "$PFGR_BANK"
          python -m smagm.cli.pfgr_lite bank-verify \
            --synthetic --config configs/pfgr_lite/synthetic.json \
            --output-root "$PFGR_OUTPUT" --run-name bank-verify \
            --device cpu --no-amp --checkpoint "$PFGR_OUTPUT/bank/inference.pt" \
            --bank-index "$PFGR_BANK" --replay-count 1
          python -m smagm.cli.pfgr_lite value-fit \
            --synthetic --config configs/pfgr_lite/synthetic.json \
            --output-root "$PFGR_OUTPUT" --run-name value126 \
            --device cpu --no-amp --checkpoint "$PFGR_OUTPUT/bank/inference.pt" \
            --bank-index "$PFGR_BANK" --value-input 126 \
            --epochs 1 --batch-size 2 --max-steps 1
          test -f "$PFGR_OUTPUT/value126/value.pt"
          python -m smagm.cli.pfgr_lite value-evaluate \
            --synthetic --config configs/pfgr_lite/synthetic.json \
            --output-root "$PFGR_OUTPUT" --run-name value126-eval \
            --device cpu --no-amp --checkpoint "$PFGR_OUTPUT/bank/inference.pt" \
            --bank-index "$PFGR_BANK" \
            --value-checkpoint "$PFGR_OUTPUT/value126/value.pt" --batch-size 2
          test -f "$PFGR_OUTPUT/value126-eval/value_evaluate_pairs.json"
          python -m smagm.cli.pfgr_lite benchmark \
            --synthetic --config configs/pfgr_lite/synthetic.json \
            --output-root "$PFGR_OUTPUT" --run-name benchmark \
            --device cpu --no-amp --checkpoint "$PFGR_OUTPUT/bank/inference.pt" \
            --max-subjects 1 --max-states 1 --candidate-count 2 \
            --query-count 8 --repeats 3 --teacher-mode iid_fixed_q
          test -f "$PFGR_OUTPUT/benchmark/benchmark.json"
          test -f "$PFGR_OUTPUT/benchmark/parity.json"
      - name: Compile sources, tests, and scripts
        run: python -m compileall -q src tests scripts
      - name: Require a clean checkout after validation
        run: git diff --check && test -z "$(git status --porcelain)"
