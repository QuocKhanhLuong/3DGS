name: CPU contract checks

on:
  pull_request:
  push:
    branches: [main, "ateam/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
      - name: Install project and test dependencies
        run: >-
          python -m pip install --upgrade pip &&
          python -m pip install numpy==2.2.6 pytest==9.1.1 &&
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.12.1 &&
          python -m pip install -e . --no-deps
      - name: Test
        run: python -m pytest -q
      - name: Validate phase-gate catalog and runner contracts
        run: |
          python scripts/check_phase.py --list
          python -m pytest -q tests/quality --tb=short
      - name: Compile sources and tests
        run: python -m compileall -q src tests
      - name: Require a clean checkout after validation
        run: git diff --check && test -z "$(git status --porcelain)"
