# Fast bootstrap for the current pure-PyTorch T0 stack.
# Target: Linux x86_64 server with an NVIDIA RTX 4070.
#
# The PyTorch wheel bundles its CUDA 12.6 runtime. The host only needs a
# compatible NVIDIA driver; a system-wide CUDA Toolkit/nvcc is not required
# until this project adds custom CUDA extensions.
#
# Create and verify:
#   conda env create -f env.yaml
#   conda activate smagm-rtx4070
#   nvidia-smi
#   python -c "import torch; print(torch.__version__, torch.version.cuda, torch.cuda.get_device_name(0)); assert torch.cuda.is_available()"
#   python -m pytest -q

name: smagm-rtx4070

channels:
  - conda-forge

dependencies:
  - python=3.10
  - "pip>=25,<27"
  - "setuptools>=68"
  - wheel
  - numpy=2.2.6
  - pytest=9.1.1
  - pip:
      # Official PyTorch 2.12.1 CUDA 12.6 wheel for CPython 3.10,
      # manylinux 2.28, x86_64. The direct URL prevents CPU-wheel fallback.
      - "https://download-r2.pytorch.org/whl/cu126/torch-2.12.1%2Bcu126-cp310-cp310-manylinux_2_28_x86_64.whl"
      - "-e .[test]"

variables:
  PYTHONNOUSERSITE: "1"
  CUDA_DEVICE_ORDER: PCI_BUS_ID
