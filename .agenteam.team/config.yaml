version: "2"
isolation: worktree

# Shared roles and pipeline for the locked point-guided MRI frontend. The
# Human Gate is deliberately represented as the final human-gated stage; this
# configuration creates no approval record and does not authorize later work.
roles:
  researcher:
    description: "Primary-source MedicalNet and locked-frontend method-boundary researcher"
    participates_in: [medicalnet, frontend_quality_review]
    can_write: false
    sandbox_mode: read-only
    handoff_contract:
      produces: "Evidence map for the coarse semantic prior or locked frontend contract, including uncertainty and falsification need"
      expects: "An applicable codegraph task, a focused point-guided question, and the current pending-Human-Gate boundary"
      passes_to: "architect for contract mapping, reviewer for adversarial review, or pm for a future human decision"

  pm:
    description: "Locked-frontend scope, stop-rule, and pending-Human-Gate governance lead"
    participates_in: [frontend_design, pending_human_gate]
    can_write: false
    sandbox_mode: read-only
    handoff_contract:
      produces: "Authorized frontend slice, explicit non-goals, required human decision, and stop condition"
      expects: "Focused implementation and verification evidence without reconstruction or clinical claims"
      passes_to: "architect, reviewer, and Human; never self-approves the gate"

  architect:
    description: "Point-guided frontend package, geometry, and tensor-contract lead"
    participates_in: [frontend_design, frontend_model, medicalnet, data_boundary_review, frontend_quality_review]
    can_write: true
    write_scope:
      - "CODEBASE.md"
      - "docs/architecture/POINT_GUIDED_FRONTEND.md"
    handoff_contract:
      produces: "Locked owner/dependency/geometry decision with affected point-guided paths and verification needs"
      expects: "A codegraph-scoped question and the T1/T2/FLAIR frontend boundary"
      passes_to: "dev for a bounded frontend change, qa for invariants, and reviewer for conformance"

  dev:
    description: "Point-guided MRI frontend and MedicalNet implementation lead"
    participates_in: [frontend_model, medicalnet]
    can_write: true
    write_scope:
      - "src/smagm/features/point_guided/**"
      - "configs/model_config.py"
      - "tests/features/point_guided/**"
      - "docs/architecture/POINT_GUIDED_FRONTEND.md"
      - "CODEBASE.md"
      - "README.md"
      - "CHANGELOG.md"
    handoff_contract:
      produces: "Bounded frontend implementation, preserved contracts, focused synthetic-test evidence, and remaining boundary"
      expects: "The exact codegraph task, locked contract, and no permission for T1ce/reconstruction/trajectory work"
      passes_to: "qa for focused tests, reviewer for boundary review, and reproducibility_auditor for evidence audit"

  qa:
    description: "CPU synthetic invariant, smoke, and frontend-quality verification lead"
    participates_in: [frontend_tests, frontend_quality_review]
    can_write: true
    write_scope:
      - "tests/features/point_guided/**"
      - "tests/test_codegraph.py"
      - "quality/**"
      - "tests/quality/**"
      - "scripts/check_phase.py"
    handoff_contract:
      produces: "Focused invariant and quality evidence naming the locked frontend contract and remaining boundary"
      expects: "A codegraph-scoped frontend or quality change with explicit expected behavior"
      passes_to: "reviewer and reproducibility_auditor; Human only for an unresolved gate decision"

  reviewer:
    description: "Independent adversarial reviewer for point-guided scope, data boundary, and quality evidence"
    participates_in: [data_boundary_review, frontend_quality_review, pending_human_gate]
    can_write: false
    sandbox_mode: read-only
    handoff_contract:
      produces: "BLOCK/WARN/NOTE findings against locked frontend contracts and the pending Human Gate"
      expects: "Focused codegraph-scoped change, test evidence, and data-boundary report where applicable"
      passes_to: "dev/architect for bounded fixes or Human for a decision"

  medical_data_steward:
    description: "Read-only BraTS21 sparse-plane and T1ce-exposure boundary auditor"
    participates_in: [data_boundary_review, pending_human_gate]
    can_write: false
    sandbox_mode: read-only
    handoff_contract:
      produces: "Fail-closed data-boundary report: legacy protocol evidence, prohibited T1ce path, and unresolved adapter decision"
      expects: "The data-boundary-audit codegraph task and no request to implement a volume adapter"
      passes_to: "reviewer and Human; dev only for a bounded fail-closed correction"

  experiment_lead:
    description: "Read-only software-evidence and scientific-claim boundary lead"
    participates_in: [frontend_quality_review, pending_human_gate]
    can_write: false
    sandbox_mode: read-only
    handoff_contract:
      produces: "Statement of what CPU software evidence supports and what reconstruction or clinical claims remain unsupported"
      expects: "Focused frontend outputs and verification evidence, not an experiment authorization"
      passes_to: "pm, reviewer, and Human for a future decision"

  reproducibility_auditor:
    description: "Read-only frontend configuration, provenance, and evidence auditor"
    participates_in: [frontend_quality_review, pending_human_gate]
    can_write: false
    sandbox_mode: read-only
    handoff_contract:
      produces: "Independent config/geometry/checkpoint/test/diff evidence audit with unresolved boundary"
      expects: "Resolved frontend configuration and commands actually run"
      passes_to: "reviewer and Human; dev or qa for bounded reproducibility fixes"

final_verify:
  - "PYTHONPATH=src .venv/bin/python -m pytest -q tests/features/point_guided"
  - "PYTHONPATH=src .venv/bin/python -m compileall -q src/smagm/features/point_guided"
  - "git diff --check"
final_verify_policy: block
final_verify_max_retries: 1

pipeline:
  stages:
    - name: frontend_design
      roles: [architect, pm]
      gate: auto
      verify: "python scripts/codegraph.py --task frontend"

    - name: frontend_model
      roles: [dev, architect]
      gate: auto
      max_retries: 2
      criteria:
        max_files_changed: 16
        scope_paths:
          - "src/smagm/features/point_guided/**"
          - "configs/model_config.py"
          - "tests/features/point_guided/**"
          - "docs/architecture/POINT_GUIDED_FRONTEND.md"
          - "CODEBASE.md"
          - "README.md"
          - "CHANGELOG.md"
        requires_tests: true
      verify: "PYTHONPATH=src .venv/bin/python -m pytest -q tests/features/point_guided/test_frontend_forward.py"

    - name: medicalnet
      roles: [dev, qa, researcher]
      gate: auto
      max_retries: 2
      criteria:
        max_files_changed: 10
        scope_paths:
          - "src/smagm/features/point_guided/medicalnet_resnet10.py"
          - "src/smagm/features/point_guided/semantic_prior.py"
          - "src/smagm/features/point_guided/config.py"
          - "tests/features/point_guided/test_semantic_prior.py"
          - "docs/architecture/POINT_GUIDED_FRONTEND.md"
        requires_tests: true
      verify: "PYTHONPATH=src .venv/bin/python -m pytest -q tests/features/point_guided/test_semantic_prior.py"

    - name: frontend_tests
      roles: [qa]
      gate: auto
      max_retries: 1
      criteria:
        max_files_changed: 14
        scope_paths:
          - "tests/features/point_guided/**"
          - "tests/test_codegraph.py"
        requires_tests: true
      verify: "PYTHONPATH=src .venv/bin/python -m pytest -q tests/features/point_guided/test_frontend_forward.py"

    - name: data_boundary_review
      roles: [medical_data_steward, architect, reviewer]
      gate: auto
      verify: "python scripts/codegraph.py --task data-boundary-audit"

    - name: frontend_quality_review
      roles: [qa, reviewer, experiment_lead, reproducibility_auditor]
      gate: auto
      max_retries: 1
      criteria:
        max_files_changed: 18
        scope_paths:
          - "src/smagm/features/point_guided/**"
          - "tests/features/point_guided/**"
          - "tests/test_codegraph.py"
          - "quality/**"
          - "tests/quality/**"
          - "scripts/check_phase.py"
          - "docs/architecture/POINT_GUIDED_FRONTEND.md"
      verify: "PYTHONPATH=src .venv/bin/python -m pytest -q tests/features/point_guided"

    - name: pending_human_gate
      roles: [pm, reviewer, medical_data_steward, experiment_lead, reproducibility_auditor]
      gate: human
      verify: "PYTHONPATH=src .venv/bin/python -m pytest -q tests/features/point_guided"

  profiles:
    frontend:
      stages: [frontend_design, frontend_model, medicalnet, frontend_tests, data_boundary_review, frontend_quality_review, pending_human_gate]
      hints: [point-guided frontend, T1 T2 FLAIR, coarse semantics, points, sparse PoU]
    model:
      stages: [frontend_design, frontend_model, frontend_tests, frontend_quality_review, pending_human_gate]
      hints: [PointGuidedMRIModel, forward_frontend, refinement, sparse PoU]
    medicalnet:
      stages: [medicalnet, frontend_tests, frontend_quality_review, pending_human_gate]
      hints: [MedicalNet, ResNet10, semantic prior, checkpoint]
    tests:
      stages: [frontend_tests, frontend_quality_review, pending_human_gate]
      hints: [synthetic invariant, frontend smoke, PoU test]
    data_boundary_audit:
      stages: [data_boundary_review, pending_human_gate]
      hints: [BraTS21, affine, T1ce exposure, volume adapter]
    quality:
      stages: [frontend_quality_review, pending_human_gate]
      hints: [quality gate, codegraph, frontend-only verification]
    review:
      stages: [data_boundary_review, frontend_quality_review, pending_human_gate]
      hints: [adversarial review, fake T1ce, boundary violation, Human Gate]
